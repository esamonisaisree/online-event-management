
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>EventHub</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#events">Events</a>
            <button id="loginBtn">Login</button>
            <button id="registerBtn">Sign Up</button>
            <button id="logoutBtn" hidden>Logout</button>
        </nav>
    </header>

    <main>
        <section id="home" class="hero">
            <h2>Discover. Register. Participate.</h2>
            <p>Explore exciting college events and reserve your place.</p>
        </section>

        <section id="authSection" class="auth-section" hidden>
            <h2 id="authTitle">Student Login</h2>

            <form id="authForm">
                <input type="text" id="name" placeholder="Full Name" hidden>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="authSubmit">Login</button>
            </form>

            <p id="authMessage"></p>
        </section>

        <section id="events">
            <h2>Upcoming Events</h2>
            <div id="eventList" class="event-list">
                Loading events...
            </div>
        </section>

        <section id="adminSection" hidden>
            <h2>Admin Dashboard</h2>
            <div id="participantsList"></div>
        </section>

        <section id="myRegistrations">
            <h2>My Registrations</h2>
            <div id="myRegistrationList"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 EventHub | Online Event Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
